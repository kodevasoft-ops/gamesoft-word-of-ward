<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OPERACIÓN TIFÓN — Teatro del Pacífico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy-950:#040910;
  --navy-900:#081422;
  --navy-800:#0f2138;
  --navy-700:#183050;
  --steel:#4a6178;
  --steel-dim:#2a3a4a;
  --radar:#39e07a;
  --radar-dim:#134d2e;
  --amber:#f0a830;
  --rust:#d1462f;
  --rust-dim:#5c2018;
  --paper:#e9e3d0;
  --paper-dim:#9c9782;
  --font-display: 'Oswald', sans-serif;
  --font-hud: 'Share Tech Mono', monospace;
  --font-ui: 'Rajdhani', sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:var(--navy-950);color:var(--paper);font-family:var(--font-ui);overflow:hidden;}
body{
  background:
    radial-gradient(ellipse at 50% -10%, rgba(57,224,122,0.06), transparent 60%),
    linear-gradient(180deg, var(--navy-950), #010204 90%);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
#app{
  width:100vw; height:100vh;
  max-width:1180px; max-height:800px;
  position:relative;
  border:1px solid var(--steel-dim);
  background:var(--navy-900);
  box-shadow:0 0 0 1px #000, 0 40px 100px rgba(0,0,0,0.6), inset 0 0 120px rgba(0,0,0,0.5);
  overflow:hidden;
}
/* faint scanline / vignette texture over everything */
#app::after{
  content:"";
  position:absolute; inset:0; pointer-events:none; z-index:500;
  background:
    repeating-linear-gradient(180deg, rgba(0,0,0,0.09) 0px, rgba(0,0,0,0.09) 1px, transparent 2px, transparent 3px),
    radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
  mix-blend-mode:multiply;
  opacity:0.55;
}
.screen{position:absolute; inset:0; display:flex; flex-direction:column;}
.hidden{display:none !important;}
::selection{background:var(--radar); color:#000;}
button{font-family:var(--font-ui); cursor:pointer;}
.btn{
  font-family:var(--font-display);
  letter-spacing:0.06em;
  text-transform:uppercase;
  background:var(--navy-800);
  border:1px solid var(--steel);
  color:var(--paper);
  padding:12px 22px;
  font-size:15px;
  transition:all .15s ease;
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
}
.btn:hover{background:var(--navy-700); border-color:var(--radar); color:var(--radar); transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn.primary{background:var(--radar-dim); border-color:var(--radar); color:var(--radar);}
.btn.primary:hover{background:var(--radar); color:#03170c;}
.btn.danger{border-color:var(--rust);}
.btn.danger:hover{background:var(--rust-dim); color:#ffb2a3; border-color:var(--rust);}
.btn:disabled{opacity:0.35; pointer-events:none;}
.label-eyebrow{
  font-family:var(--font-hud); font-size:11px; letter-spacing:0.25em; color:var(--radar); text-transform:uppercase; opacity:0.85;
}
.hairline{height:1px; background:linear-gradient(90deg, transparent, var(--steel), transparent);}
</style>
</head>
<body>
<div id="app">

  <!-- ===================== MAIN MENU ===================== -->
  <div id="screen-menu" class="screen"></div>

  <!-- ===================== BRIEFING / LEVEL SELECT ===================== -->
  <div id="screen-briefing" class="screen hidden"></div>

  <!-- ===================== GAME ===================== -->
  <div id="screen-game" class="screen hidden">
    <div id="game-wrap" style="position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:#000;">
      <canvas id="game-canvas" width="960" height="600" style="width:100%; height:100%; max-width:100%; max-height:100%; object-fit:contain; image-rendering:crisp-edges;"></canvas>
      <div id="hud" style="position:absolute; inset:0; pointer-events:none;"></div>
      <div id="game-toolbar" style="position:absolute; top:10px; right:10px; display:flex; gap:8px; z-index:40; pointer-events:auto;"></div>
      <div id="pause-overlay" class="hidden" style="position:absolute; inset:0; background:rgba(4,9,16,0.88); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px; z-index:50;"></div>
      <div id="mobile-controls" class="hidden"></div>
    </div>
  </div>

  <!-- ===================== RESULT ===================== -->
  <div id="screen-result" class="screen hidden"></div>

</div>
<script src="game.js"></script>
</body>
</html>
